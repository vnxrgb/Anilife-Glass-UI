[package]
name = "anilumos-wasm-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
wasmtime = { version = "49", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "anyhow"] }
jni = "0.21"
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
serde = { version = "1", features = ["derive"] }
