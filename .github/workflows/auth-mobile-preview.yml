name: Validate AniLumos OAuth mobile preview

on:
  push:
    branches: [feature/mobile-polish]
    paths:
      - .github/workflows/auth-mobile-preview.yml
      - app/src/main/java/com/anilili/data/auth/**
      - app/src/main/java/com/anilili/ui/profile/**
      - app/src/main/java/com/anilili/ui/settings/**
      - app/src/main/java/com/anilili/ui/pairing/**
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify OAuth settings and build experimental mobile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
      ANILIST_CLIENT_ID: ${{ vars.ANILIST_CLIENT_ID }}
      MAL_CLIENT_ID: ${{ vars.MAL_CLIENT_ID }}
      MAL_REDIRECT_URI: ${{ vars.MAL_REDIRECT_URI }}
    steps:
      - name: Check out mobile polish branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required OAuth values without disclosing them
        shell: bash
        run: |
          set -euo pipefail
          for name in ANILIST_CLIENT_ID MAL_CLIENT_ID MAL_REDIRECT_URI; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "::error::Missing GitHub Actions variable: $name"
              exit 1
            fi
            echo "$name is set"
          done
          case "$MAL_REDIRECT_URI" in
            http://localhost/|https://localhost/|anilife://auth/mal)
              echo "MAL redirect matches a callback scheme accepted by AniLumos" ;;
            *) echo "::error::MAL redirect does not match the app's supported callback patterns"; exit 1 ;;
          esac

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Run mobile tests, lint and assemble
        run: ./gradlew :app:testMobileDebugUnitTest :app:lintMobileDebug :app:assembleMobileDebug --max-workers=2 --no-configuration-cache --console=plain

      - name: Publish experimental debug APK as workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Anilumos-Mobile-OAuth-debug-preview
          path: app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error
          retention-days: 7
