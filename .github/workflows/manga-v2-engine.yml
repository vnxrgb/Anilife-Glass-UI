name: Manga v2 engine contract
on:
  push:
    branches: [feature/manga-v2]
    paths:
      - 'manga-engine/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/manga-v2-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    if: github.ref == 'refs/heads/feature/manga-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Compile and test isolated engine (no live provider requests)
        run: ./gradlew :manga-engine:testDebugUnitTest :manga-engine:assembleDebug --max-workers=2 --no-configuration-cache --console=plain --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: manga-engine-test-report
          path: manga-engine/build/reports/tests/
          if-no-files-found: ignore
