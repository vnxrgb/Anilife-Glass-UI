name: Manga v2 engine contract
on:
  push:
    branches: [feature/manga-v2]
    paths:
      - 'manga-engine/**'
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/manga-v2-engine.yml'
  workflow_dispatch:
    inputs:
      live_source:
        description: 'Reviewed parser source ID (blank runs local tests only)'
        type: string
        required: false
      live_hosts:
        description: 'Approved HTTPS hostnames, comma separated'
        type: string
        required: false
      live_title:
        description: 'Exact title of an authorized test manga'
        type: string
        required: false
      live_chapter:
        description: 'Exact authorized chapter number'
        type: string
        required: false
      live_authorized:
        description: 'I have permission for automated access to this source and title'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: manga-v2-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine:
    if: github.ref == 'refs/heads/feature/manga-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false
      - name: Compile and test isolated engine (no live provider requests)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/manga-engine-attempt-$attempt.log"
            set +e
            ./gradlew :manga-engine:testDebugUnitTest :manga-engine:assembleDebug --max-workers=2 --no-configuration-cache --console=plain --stacktrace 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            # Only transient repository transport errors are retried. Never hide compiler or test failures.
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Received status code (429|502|503|504)|Read timed out|Connection timed out|Connection reset' "$log" || ! grep -Eq 'Could not (GET|resolve|get resource)|Could not resolve all files' "$log"; then
              exit "$result"
            fi
            delay=$((attempt * 60))
            echo "::warning::Transient dependency download failure; retrying after ${delay}s"
            sleep "$delay"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: manga-engine-test-report
          path: |
            manga-engine/build/reports/tests/
            manga-engine/build/reports/provider-compatibility/
          if-no-files-found: ignore
  android-device:
    if: github.ref == 'refs/heads/feature/manga-v2'
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MANGA_DEVICE_API: ${{ (github.event_name == 'push' && github.event.head_commit.message == 'Retest Atsu Chico with Android image format compatibility') && '34' || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ ! -x "$sdk_tools/sdkmanager" ]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$sdkmanager_path"
            sdk_tools="$(dirname "$sdkmanager_path")"
          fi
          test -x "$sdk_tools/sdkmanager"
          test -x "$sdk_tools/avdmanager"
          export PATH="$sdk_tools:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          echo "$sdk_tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0 libgl1 libegl1 libnss3 libx11-6 libxcb1 libxcomposite1 libxcursor1 libxi6 libxrandr2 libxrender1 libxtst6 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1 libasound2t64
          sudo chmod a+rw /dev/kvm
          "$sdk_tools/sdkmanager" --sdk_root="$ANDROID_HOME" 'emulator' 'platform-tools' "system-images;android-$MANGA_DEVICE_API;default;x86_64"
          test -x "$ANDROID_HOME/emulator/emulator"
          qemu="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          test -x "$qemu"
          export LD_LIBRARY_PATH="$ANDROID_HOME/emulator/lib64:$ANDROID_HOME/emulator/lib64/qt/lib:${LD_LIBRARY_PATH:-}"
          ldd "$qemu" | tee "$RUNNER_TEMP/manga-emulator-libraries.log"
          if grep -q 'not found' "$RUNNER_TEMP/manga-emulator-libraries.log"; then
            echo "::error::Unresolved emulator runtime libraries"
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export ANDROID_USER_HOME="$RUNNER_TEMP/manga-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          avd_dir="$ANDROID_AVD_HOME/manga-ci.avd"
          printf 'no\n' | "$sdk_tools/avdmanager" create avd --force --name manga-ci --package "system-images;android-$MANGA_DEVICE_API;default;x86_64" --path "$avd_dir"
          test -s "$avd_dir/config.ini"
          # Use an absolute AVD pointer, independent of SDK tool home-directory defaults.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-%s\n' "$avd_dir" "$MANGA_DEVICE_API" > "$ANDROID_AVD_HOME/manga-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$RUNNER_TEMP/manga-avds.log"
          grep -Fx manga-ci "$RUNNER_TEMP/manga-avds.log"
      - name: Compile Android test APK before boot
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            log="$RUNNER_TEMP/manga-device-build-attempt-$attempt.log"
            set +e
            ./gradlew :manga-engine:assembleDebugAndroidTest --max-workers=2 --no-configuration-cache --console=plain --stacktrace 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ] || ! grep -Eq 'Received status code (429|502|503|504)|Read timed out|Connection timed out|Connection reset' "$log" || ! grep -Eq 'Could not (GET|resolve|get resource|download)|Could not resolve all files' "$log"; then
              exit "$result"
            fi
            delay=$((attempt * 60))
            echo "::warning::Transient Android test dependency download failure; retrying after ${delay}s"
            sleep "$delay"
          done
      - name: Run isolated Android instrumentation tests
        shell: bash
        env:
          LIVE_SOURCE: ${{ inputs.live_source }}
          LIVE_HOSTS: ${{ inputs.live_hosts }}
          LIVE_TITLE: ${{ inputs.live_title }}
          LIVE_CHAPTER: ${{ inputs.live_chapter }}
          LIVE_AUTHORIZED: ${{ inputs.live_authorized }}
          ATSU_METADATA: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run one-shot Atsu metadata validation' }}
          ATSU_CHICO: ${{ github.event_name == 'push' && (github.event.head_commit.message == 'Run one-shot Atsu Chico chapter 3 validation' || github.event.head_commit.message == 'Retest Atsu Chico with Android image format compatibility' || github.event.head_commit.message == 'Validate bounded legacy Android AVIF decoding' || github.event.head_commit.message == 'Resolve AVIF via upstream documented Maven repository') }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          log="$RUNNER_TEMP/manga-emulator.log"
          test -s "$ANDROID_AVD_HOME/manga-ci.ini"
          test -s "$ANDROID_AVD_HOME/manga-ci.avd/config.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx manga-ci
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd manga-ci -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics -memory 2048 -cores 2 > "$log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              adb devices -l || true
              tail -200 "$log" || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          export ANDROID_SERIAL=emulator-5554
          deadline=$((SECONDS + 600))
          until [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Emulator process exited before boot"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Emulator boot timed out"
              exit 124
            fi
            sleep 5
          done
          adb shell input keyevent 82
          args=()
          if [ "$ATSU_METADATA" = true ]; then
            args+=("-Pandroid.testInstrumentationRunnerArguments.atsuMetadata=true")
          fi
          if [ "$ATSU_CHICO" = true ]; then
            args+=("-Pandroid.testInstrumentationRunnerArguments.atsuChico=true")
          fi
          if [ -n "$LIVE_SOURCE$LIVE_HOSTS$LIVE_TITLE$LIVE_CHAPTER" ] || [ "$LIVE_AUTHORIZED" = true ]; then
            if [ "$LIVE_AUTHORIZED" != true ] || [ -z "$LIVE_SOURCE" ] || [ -z "$LIVE_HOSTS" ] || [ -z "$LIVE_TITLE" ] || [ -z "$LIVE_CHAPTER" ]; then
              echo "::error::Live checks require source, hosts, exact authorized title, chapter and permission confirmation"
              exit 1
            fi
            args+=("-Pandroid.testInstrumentationRunnerArguments.liveSource=$LIVE_SOURCE")
            args+=("-Pandroid.testInstrumentationRunnerArguments.liveHosts=$LIVE_HOSTS")
            args+=("-Pandroid.testInstrumentationRunnerArguments.liveTitle=$LIVE_TITLE")
            args+=("-Pandroid.testInstrumentationRunnerArguments.liveChapter=$LIVE_CHAPTER")
          fi
          ./gradlew :manga-engine:connectedDebugAndroidTest --max-workers=2 --no-configuration-cache --console=plain --stacktrace "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: manga-engine-device-report
          path: |
            manga-engine/build/reports/androidTests/
            manga-engine/build/outputs/androidTest-results/
            ${{ runner.temp }}/manga-emulator.log
            ${{ runner.temp }}/manga-emulator-libraries.log
            ${{ runner.temp }}/manga-avds.log
            ${{ runner.temp }}/manga-device-build-attempt-*.log
          if-no-files-found: ignore

  mobile-ui-compile:
    if: github.ref == 'refs/heads/feature/manga-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Compile mobile UI and test local reader
        run: ./gradlew :app:compileMobileDebugKotlin :app:testMobileDebugUnitTest --tests 'com.anilili.manga.*' --max-workers=2 --no-configuration-cache --console=plain --stacktrace
