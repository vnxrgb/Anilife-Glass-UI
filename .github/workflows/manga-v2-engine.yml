name: Manga v2 engine contract
on:
  push:
    branches: [feature/manga-v2]
    paths:
      - 'manga-engine/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/manga-v2-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manga-v2-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    if: github.ref == 'refs/heads/feature/manga-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: false
      - name: Compile and test isolated engine (no live provider requests)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/manga-engine-attempt-$attempt.log"
            set +e
            ./gradlew :manga-engine:testDebugUnitTest :manga-engine:assembleDebug --max-workers=2 --no-configuration-cache --console=plain --stacktrace 2>&1 | tee "$log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            # Only transient repository transport errors are retried. Never hide compiler or test failures.
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'Received status code (429|502|503|504)|Read timed out|Connection timed out|Connection reset' "$log" || ! grep -Eq 'Could not (GET|resolve|get resource)|Could not resolve all files' "$log"; then
              exit "$result"
            fi
            delay=$((attempt * 60))
            echo "::warning::Transient dependency download failure; retrying after ${delay}s"
            sleep "$delay"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: manga-engine-test-report
          path: manga-engine/build/reports/tests/
          if-no-files-found: ignore
  android-device:
    if: github.ref == 'refs/heads/feature/manga-v2'
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
      - name: Prepare Android emulator
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'platform-tools' 'system-images;android-30;default;x86_64'
          test -x "$ANDROID_HOME/emulator/emulator"
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          echo no | avdmanager create avd --force --name manga-ci --package 'system-images;android-30;default;x86_64'
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Run isolated Android instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          log="$RUNNER_TEMP/manga-emulator.log"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd manga-ci -port 5554 -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics -memory 2048 -cores 2 > "$log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              adb devices -l || true
              tail -200 "$log" || true
            fi
            kill "$emulator_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          export ANDROID_SERIAL=emulator-5554
          deadline=$((SECONDS + 600))
          until [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Emulator process exited before boot"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Emulator boot timed out"
              exit 124
            fi
            sleep 5
          done
          adb shell input keyevent 82
          ./gradlew :manga-engine:connectedDebugAndroidTest --max-workers=2 --no-configuration-cache --console=plain --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: manga-engine-device-report
          path: |
            manga-engine/build/reports/androidTests/
            manga-engine/build/outputs/androidTest-results/
            ${{ runner.temp }}/manga-emulator.log
          if-no-files-found: ignore
