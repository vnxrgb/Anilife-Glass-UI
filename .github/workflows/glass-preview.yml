name: Universal Glass UI APK preview

on:
  push:
    branches: [feature/unified-glass-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: universal-glass-preview
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build-and-publish:
    name: Verify mobile and publish one direct APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # This feature branch needs its own writable dependency cache. A read-only
          # cache forces repeated Maven Central downloads and triggers HTTP 429.
          cache-read-only: false

      - name: Unit tests, lint and universal mobile APK
        shell: bash
        run: |
          set -euo pipefail
          # Maven Central may rate-limit cold GitHub runners. Back off instead of
          # retrying immediately; preserve a genuine compilation/test failure.
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew :app:testMobileDebugUnitTest :app:lintMobileDebug :app:assembleMobileDebug --max-workers=2 --no-configuration-cache --console=plain > gradle-build.log 2>&1; then
              cat gradle-build.log
              exit 0
            fi
            cat gradle-build.log
            if ! grep -Eq 'Received status code 429|Too Many Requests|HTTP 429' gradle-build.log; then
              echo "::error::Build failed for a reason other than Maven rate limiting."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven rate limiting persists after three attempts."
              exit 1
            fi
            sleep $((attempt * 120))
          done

      - name: Verify universal APK and stage one downloadable file
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/mobile/debug/Anilife-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          mkdir -p dist
          cp "$apk" dist/anilife-glass-universal.apk
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1

      - name: Publish direct APK as preview release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="glass-ui-preview"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "Anilife Glass UI — universal Android preview" \
              --notes "One universal mobile debug APK; UI preview only. Playback and device performance still require testing."
          fi
          gh release upload "$tag" dist/anilife-glass-universal.apk --clobber
          gh release edit "$tag" --target "$GITHUB_SHA" \
            --notes "Universal Android debug APK built from $GITHUB_SHA. Mobile unit tests and lint passed. This is a preview, not a stable signed release. Physical-device UI and playback tests remain."
          echo "Direct APK: https://github.com/$GH_REPO/releases/download/$tag/anilife-glass-universal.apk" >> "$GITHUB_STEP_SUMMARY"
