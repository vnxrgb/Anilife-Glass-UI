name: WASM runtime proof
on:
  push:
    branches: [feature/wasm-sandbox]
    paths: ['wasm-runtime/**', '.github/workflows/wasm-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Host runtime tests
        run: |
          rustup update stable
          cargo +stable test --manifest-path wasm-runtime/Cargo.toml
      - name: Android ARM64 compile proof
        run: |
          rustup target add aarch64-linux-android --toolchain stable
          cargo +stable install cargo-ndk --locked
          cargo +stable ndk -t arm64-v8a -p 23 -o "$RUNNER_TEMP/wasm-jni" build --manifest-path wasm-runtime/Cargo.toml --release
