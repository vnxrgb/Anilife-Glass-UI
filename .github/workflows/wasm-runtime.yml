name: WASM runtime proof
on:
  push:
    branches: [feature/wasm-sandbox]
    paths: ['wasm-runtime/**', 'app/**', '.github/workflows/wasm-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Host runtime tests
        run: |
          rustup update stable
          rustup target add wasm32-wasip2 --toolchain stable
          cargo +stable build --manifest-path wasm-runtime/fixture/Cargo.toml --target wasm32-wasip2 --release
          export WASM_FIXTURE="$GITHUB_WORKSPACE/wasm-runtime/fixture/target/wasm32-wasip2/release/sandbox_fixture.wasm"
          cargo +stable test --manifest-path wasm-runtime/Cargo.toml
      - name: Android ARM64 compile proof
        run: |
          rustup target add aarch64-linux-android --toolchain stable
          cd wasm-runtime
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo +stable build --target aarch64-linux-android --release
          mkdir -p "$RUNNER_TEMP/wasm-jni/arm64-v8a"
          cp target/aarch64-linux-android/release/libanilumos_wasm_runtime.so "$RUNNER_TEMP/wasm-jni/arm64-v8a/"
      - name: Upload native runtime proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-arm64-runtime
          path: ${{ runner.temp }}/wasm-jni/arm64-v8a/libanilumos_wasm_runtime.so
          if-no-files-found: error
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Package experimental mobile debug APK
        run: |
          mkdir -p app/src/mobile/jniLibs/arm64-v8a
          cp "$RUNNER_TEMP/wasm-jni/arm64-v8a/libanilumos_wasm_runtime.so" app/src/mobile/jniLibs/arm64-v8a/
          mkdir -p app/src/androidTest/assets/wasm
          cp wasm-runtime/fixture/target/wasm32-wasip2/release/sandbox_fixture.wasm app/src/androidTest/assets/wasm/fixture.wasm
          ./gradlew :app:testMobileDebugUnitTest :app:assembleMobileDebug :app:assembleMobileDebugAndroidTest --max-workers=2 --no-configuration-cache --console=plain
      - name: Verify native library packaged
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          apks = list(pathlib.Path("app/build/outputs/apk/mobile/debug").rglob("*.apk"))
          assert apks, "No mobile APKs"
          name = "lib/arm64-v8a/libanilumos_wasm_runtime.so"
          assert any(name in zipfile.ZipFile(apk).namelist() for apk in apks), "Native library missing"
          PY
      - name: Archive experimental mobile build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wasm-mobile-debug
          path: |
            app/build/outputs/apk/mobile/debug/*.apk
            app/build/outputs/apk/androidTest/mobile/debug/*.apk
          if-no-files-found: error
