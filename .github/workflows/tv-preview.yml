name: AniLumos Android TV preview APK

on:
  push:
    branches: [feature/tv-polish]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/tv-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anilumos-tv-preview
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

jobs:
  build-tv-preview:
    name: Verify and build Android TV APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false

      - name: Unit tests, lint and assemble TV debug APK
        run: ./gradlew :app:testTvDebugUnitTest :app:lintTvDebug :app:assembleTvDebug --max-workers=2 --no-configuration-cache --console=plain

      - name: Verify and stage TV APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/tv/debug/Anilumos-debug_tv.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          # A successful build is not enough: reject an accidentally packaged phone APK
          # or a TV APK that silently loses its remote launcher entry.
          badging="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk")"
          grep -Fq "name='com.anilumos.app.debug'" <<< "$badging"
          grep -Fq "uses-feature-not-required: name='android.hardware.touchscreen'" <<< "$badging"
          # TV builds must advertise Leanback without requiring Play Store TV hardware.
          # This keeps Fire TV sideloads compatible and catches flavor-manifest regressions.
          grep -Fq "uses-feature-not-required: name='android.software.leanback'" <<< "$badging"
          # The TV launcher needs a real banner resource, not the phone's icon alone.
          if ! grep -Eq "^application:.*banner='" <<< "$badging"; then
            echo "::error::TV launcher banner missing from packaged APK"
            exit 1
          fi
          # Capture the complete manifest dump before matching: grep -q in a pipe can
          # close early and make aapt fail with SIGPIPE under pipefail.
          manifest_tree="$("$ANDROID_HOME/build-tools/35.0.1/aapt" dump xmltree "$apk" AndroidManifest.xml)"
          grep -Fq 'android.intent.category.LEANBACK_LAUNCHER' <<< "$manifest_tree"
          mkdir -p dist
          cp "$apk" dist/Anilumos-TV-preview.apk
          sha256sum dist/Anilumos-TV-preview.apk > dist/SHA256SUMS

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anilumos-tv-preview-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Permanent alpha releases are built and published only from
      # https://github.com/vnxrgb/anilumos-preview/actions/workflows/tv-preview.yml
      # Keep this branch's TV verification and temporary artifacts, but never
      # publish experimental packages to the stable source repository.
